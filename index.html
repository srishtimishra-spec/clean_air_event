/* ============================================================
   STORAGE
   Works in three situations:
   - inside the Claude preview            -> window.storage
   - on a normal web host / GitHub Pages  -> browser localStorage
   - opened from disk (file://) or private -> memory + on-screen warning
     so nobody loses work without knowing.
   ============================================================ */
const KEY = "cah2026:data";
const HAS_ARTIFACT_STORAGE = (typeof window !== "undefined") && window.storage
  && typeof window.storage.get === "function" && typeof window.storage.set === "function";

/* Does localStorage actually persist here? (blocked on file:// and some private windows) */
let LOCAL_OK = false;
try{
  const tk = "cah2026:__t";
  localStorage.setItem(tk, "1");
  LOCAL_OK = localStorage.getItem(tk) === "1";
  localStorage.removeItem(tk);
}catch(e){ LOCAL_OK = false; }

const STORAGE_MODE = HAS_ARTIFACT_STORAGE ? "artifact" : (LOCAL_OK ? "local" : "memory");
let MEMORY_STORE = null; /* mirror so the current session always works */

async function loadData(){
  try{
    if(STORAGE_MODE === "artifact"){
      const res = await window.storage.get(KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    } else if(STORAGE_MODE === "local"){
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    } else if(MEMORY_STORE){
      return JSON.parse(MEMORY_STORE);
    }
  }catch(e){ /* first run or unavailable */ }
  return null;
}
async function saveData(d){
  const json = JSON.stringify(d);
  MEMORY_STORE = json; /* always keep an in-memory mirror */
  try{
    if(STORAGE_MODE === "artifact"){
      await window.storage.set(KEY, json, true);
    } else if(STORAGE_MODE === "local"){
      localStorage.setItem(KEY, json);
    }else{
      return false; /* memory-only */
    }
    return true;
  }catch(e){
    console.error("save failed", e);
    flash("This browser is blocking storage — use Backup to keep your changes");
    return false;
  }
}

function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); }
function isOpen(t){ return t.status!=="Completed" && t.status!=="Not required"; }
function flash(msg){
  const f=el("div","cah-flash",msg); document.body.appendChild(f);
  requestAnimationFrame(()=>f.classList.add("show"));
  setTimeout(()=>{f.classList.remove("show"); setTimeout(()=>f.remove(),300);},2200);
}
function countdown(){ const d=daysBetween(EVENT.startISO); return d; }

/* ---------- BACKUP / RESTORE ---------- */
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "CAH2026-hub-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    flash("Backup downloaded");
  }catch(e){ console.error(e); flash("Could not create backup"); }
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = ()=>{
    const file = inp.files && inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const loaded = JSON.parse(reader.result);
        if(!loaded || !loaded.tasks){ flash("That file isn't a valid backup"); return; }
        if(!confirm("Replace everything currently in the hub with this backup?")) return;
        DATA = loaded;
        persist(); render(); flash("Backup restored");
      }catch(e){ console.error(e); flash("Could not read that file"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ============================================================
   DERIVED HELPERS
   ============================================================ */
function splitNames(s){ return (s||"").split(/,|&|\band\b/).map(x=>x.trim()).filter(Boolean); }
function uniquePeople(){
  return DATA.people.map(p=>p.name).sort((a,b)=>a.localeCompare(b));
}
function aliasesFor(name){
  const p = DATA.people.find(x=>x.name===name);
  return (p && p.aliases && p.aliases.length) ? p.aliases : [name];
}
/* true if a roster person (by full name) is named in a free-text field like "Sahbaz, Priyanka" */
function nameInText(fullName, text){
  if(!fullName) return false;
  const tokens = splitNames(text);
  const al = aliasesFor(fullName);
  return tokens.some(tok => al.includes(tok) || tok===fullName);
}
function taskMatchesPerson(t,person){
  if(!person) return true;
  return nameInText(person,t.person) || nameInText(person,t.coord);
}

/* Add a new person to the roster (used by person pickers) */
function addPersonToRoster(name){
  name = (name||"").trim();
  if(!name) return null;
  if(DATA.people.some(p=>p.name.toLowerCase()===name.toLowerCase())) return name;
  const short = name.split(" ")[0];
  DATA.people.push({id:"P"+Date.now(), name, email:"", aliases:[name, short].filter((x,i,a)=>a.indexOf(x)===i), role:"Member", eventRole:""});
  persist();
  return name;
}

/* Reusable person picker: chips of selected people + dropdown to add existing / type a new name.
   value is a comma-separated string (matches the task-sheet convention). onChange(newValue). */
function personPicker(value, onChange){
  const wrap = el("div","cah-picker");
  let selected = splitNames(value).map(tok=>{
    const match = DATA.people.find(p=> p.name===tok || (p.aliases&&p.aliases.includes(tok)));
    return match ? match.name : tok;
  });
  function commit(){ onChange(selected.join(", ")); }
  function draw(){
    wrap.innerHTML = "";
    const chips = el("div","cah-picker-chips");
    if(!selected.length) chips.appendChild(el("span","cah-picker-empty","No one assigned"));
    selected.forEach((name,idx)=>{
      const chip = el("span","cah-picker-chip");
      chip.innerHTML = `<span>${esc(name)}</span>`;
      const x = el("button","cah-picker-x","×");
      x.onclick = ()=>{ selected.splice(idx,1); commit(); draw(); };
      chip.appendChild(x);
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);

    const row = el("div","cah-picker-row");
    const sel = el("select","cah-picker-select");
    sel.innerHTML = `<option value="">+ Add person…</option>` +
      DATA.people.map(p=>p.name).sort((a,b)=>a.localeCompare(b))
        .filter(n=>!selected.includes(n))
        .map(n=>`<option>${esc(n)}</option>`).join("") +
      `<option value="__new">➕ New person not listed…</option>`;
    sel.onchange = ()=>{
      const val = sel.value;
      if(!val){ return; }
      if(val==="__new"){
        const nm = prompt("Add a new team member (full name):");
        const added = addPersonToRoster(nm);
        if(added && !selected.includes(added)){ selected.push(added); commit(); }
        draw();
        return;
      }
      if(!selected.includes(val)){ selected.push(val); commit(); }
      draw();
    };
    row.appendChild(sel);
    wrap.appendChild(row);
  }
  draw();
  return wrap;
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(v){
  const open = DATA.tasks.filter(isOpen);
  const done = DATA.tasks.filter(t=>t.status==="Completed");
  const pct = DATA.tasks.length? Math.round(done.length/DATA.tasks.filter(t=>t.status!=="Not required").length*100):0;
  const overdue = open.filter(t=>{const d=daysBetween(t.due); return d!=null && d<0;});
  const soon = open.filter(t=>{const d=daysBetween(t.due); return d!=null && d>=0 && d<=7;});
  const blocked = open.filter(t=>t.status==="Blocked");
  const awaiting = open.filter(t=>t.status==="Awaiting input" || t.status==="Under review");

  // hero
  const hero = el("div","cah-hero");
  const d = countdown();
  hero.innerHTML = `
    <div class="cah-hero-l">
      <div class="cah-eyebrow">International Day of Clean Air for blue skies</div>
      <div class="cah-hero-title">${EVENT.name}</div>
      <div class="cah-hero-tag">${EVENT.tagline}</div>
      <div class="cah-hero-meta">${EVENT.dates}&nbsp;&nbsp;·&nbsp;&nbsp;${EVENT.time}&nbsp;&nbsp;·&nbsp;&nbsp;${EVENT.venue}</div>
    </div>
    <div class="cah-hero-count">
      <div class="cah-count-num">${d}</div><div class="cah-count-lbl">days remaining</div>
    </div>`;
  v.appendChild(hero);

  // progress bar
  const prog = el("div","cah-progress-card");
  prog.innerHTML = `
    <div class="cah-prog-head"><span>Overall progress</span><b>${pct}%</b></div>
    <div class="cah-prog-track"><div class="cah-prog-fill" style="width:${pct}%"></div></div>
    <div class="cah-prog-legend">${done.length} completed · ${open.length} open · ${DATA.tasks.length} total</div>`;
  v.appendChild(prog);

  // stat tiles
  const tiles = el("div","cah-tiles");
  const tileDefs = [
    ["Overdue", overdue.length, C.red, ()=>{VIEW="tasks";render();setTimeout(()=>applyQuickFilter("overdue"))}],
    ["Due in 7 days", soon.length, C.orange, ()=>{VIEW="tasks";render();setTimeout(()=>applyQuickFilter("soon"))}],
    ["Blocked", blocked.length, C.redDark, ()=>{VIEW="dependencies";render();}],
    ["Awaiting input / review", awaiting.length, C.blue, ()=>{VIEW="tasks";render();setTimeout(()=>applyQuickFilter("awaiting"))}]
  ];
  tileDefs.forEach(([lbl,n,col,fn])=>{
    const t = el("button","cah-tile"); t.style.setProperty("--tc",col);
    t.innerHTML = `<div class="cah-tile-n">${n}</div><div class="cah-tile-l">${lbl}</div>`;
    t.onclick = fn; tiles.appendChild(t);
  });
  v.appendChild(tiles);

  // agenda infographic (both days at a glance)
  v.appendChild(buildAgendaInfographic());

  // two-column: attention lists + side
  const grid = el("div","cah-dash-grid");

  const attention = el("div","cah-card");
  attention.appendChild(cardHead("Needs attention now", overdue.length+blocked.length+" flagged"));
  const list = el("div","cah-mini-list");
  const flagged = [...overdue.map(t=>[t,"Overdue "+Math.abs(daysBetween(t.due))+"d",C.red]),
                   ...blocked.map(t=>[t,"Blocked",C.redDark]),
                   ...soon.filter(t=>!overdue.includes(t)).map(t=>[t,"Due "+fmtDate(t.due),C.orange])]
                  .slice(0,10);
  if(!flagged.length){ list.appendChild(el("div","cah-empty","Nothing flagged. Clear skies.")); }
  flagged.forEach(([t,tag,col])=>{
    const row = el("button","cah-mini-row");
    row.innerHTML = `<span class="cah-dot" style="background:${col}"></span>
      <span class="cah-mini-task">${esc(t.task)}</span>
      <span class="cah-mini-person">${esc(t.person||"—")}</span>
      <span class="cah-mini-tag" style="color:${col}">${tag}</span>`;
    row.onclick = ()=>openTaskModal(t.id);
    list.appendChild(row);
  });
  attention.appendChild(list);
  grid.appendChild(attention);

  const side = el("div","cah-dash-side");

  // announcements
  const ann = el("div","cah-card");
  ann.appendChild(cardHead("Announcements", null, ()=>{
    const msg = prompt("New announcement / update:");
    if(msg){ DATA.announcements.unshift({id:"A"+Date.now(),msg,date:"2026-08-17"}); persist(); renderView(); }
  }, "+ Add"));
  const al = el("div","cah-ann-list");
  if(!DATA.announcements.length) al.appendChild(el("div","cah-empty","No announcements yet."));
  DATA.announcements.slice(0,5).forEach(a=>{
    const r = el("div","cah-ann-row");
    r.innerHTML = `<div class="cah-ann-msg">${esc(a.msg)}</div><div class="cah-ann-date">${fmtDate(a.date)}</div>`;
    const del = el("button","cah-x","×"); del.title="Remove";
    del.onclick=()=>{DATA.announcements=DATA.announcements.filter(x=>x.id!==a.id);persist();renderView();};
    r.appendChild(del);
    al.appendChild(r);
  });
  ann.appendChild(al);
  side.appendChild(ann);

  // quick links (editable)
  const ql = el("div","cah-card");
  ql.appendChild(cardHead("Quick links", null, ()=>openQuickLinkModal(null), "+ Add"));
  const qll = el("div","cah-ql-list");
  if(!DATA.quickLinks.length) qll.appendChild(el("div","cah-empty","No quick links yet. Add the ones your team opens most."));
  DATA.quickLinks.forEach(q=>{
    const rowEl = el("div","cah-ql-row");
    const a = el("a","cah-ql"); a.href=q.url; a.target="_blank"; a.rel="noopener";
    a.innerHTML = `${icon('note')}<span>${esc(q.label)}</span>`;
    rowEl.appendChild(a);
    const edit = el("button","cah-ql-edit","Edit"); edit.title="Edit link";
    edit.onclick=()=>openQuickLinkModal(q.id);
    rowEl.appendChild(edit);
    qll.appendChild(rowEl);
  });
  ql.appendChild(qll);
  side.appendChild(ql);

  grid.appendChild(side);
  v.appendChild(grid);
}

function cardHead(title, sub, action, actionLabel){
  const h = el("div","cah-card-head");
  h.innerHTML = `<h3>${esc(title)}</h3>${sub?`<span class="cah-card-sub">${esc(sub)}</span>`:""}`;
  if(action){ const b=el("button","cah-card-action",actionLabel||"+"); b.onclick=action; h.appendChild(b); }
  return h;
}

const AG_TYPE = {

  parallel:{c:"var(--green)", label:"Parallel tracks"},

function buildAgendaInfographic(){

        <div class="cah-ag-time">${esc(a.time)}</div>
        <div class="cah-ag-slot">
          <div class="cah-ag-a">${esc(a.a)}</div>
          ${twin?`<div class="cah-ag-b"><span class="cah-ag-track">Magnolia</span>${esc(a.b)}</div>`:""}
        </div>`;
      col.appendChild(row);
    });
    cols.appendChild(col);
  });
  card.appendChild(cols);
  return card;

function openQuickLinkModal(id){
  const q = id? DATA.quickLinks.find(x=>x.id===id) : {id:"Q"+Date.now(),label:"",url:""};
  const isNew=!id;
  const ov=el("div","cah-modal-ov"); const m=el("div","cah-modal cah-modal-sm");
  m.innerHTML=`<div class="cah-modal-head"><h2>${isNew?"Add quick link":"Edit quick link"}</h2><button class="cah-modal-x">×</button></div>`;
  const body=el("div","cah-modal-body");
  const f=(label,key)=>{const w=el("label","cah-field");w.appendChild(el("span",null,label));const i=el("input");i.value=q[key]||"";i.dataset.key=key;w.appendChild(i);return w;};
  body.appendChild(f("Label","label"));
  body.appendChild(f("URL","url"));
  m.appendChild(body);
  const foot=el("div","cah-modal-foot");
  if(!isNew){const del=el("button","cah-btn cah-btn-danger","Remove");del.onclick=()=>{DATA.quickLinks=DATA.quickLinks.filter(x=>x.id!==q.id);persist();ov.remove();renderView();};foot.appendChild(del);}
  const sp=el("div");sp.style.flex="1";foot.appendChild(sp);
  const c=el("button","cah-btn cah-btn-ghost","Cancel");c.onclick=()=>ov.remove();foot.appendChild(c);
  const s=el("button","cah-btn cah-btn-primary",isNew?"Add":"Save");
  s.onclick=()=>{m.querySelectorAll("[data-key]").forEach(i=>{q[i.dataset.key]=i.value.trim();});if(!q.label){flash("Label required");return;}if(q.url&&!/^https?:\/\//.test(q.url))q.url="https://"+q.url;if(isNew)DATA.quickLinks.push(q);persist();ov.remove();renderView();flash("Saved");};
  foot.appendChild(s); m.appendChild(foot);
  m.querySelector(".cah-modal-x").onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};

/* ---------- TASK TRACKER ---------- */
let TASK_QUICK = "all";
function applyQuickFilter(k){ TASK_QUICK=k; const s=$("#cah-quick-"+k); if(s){document.querySelectorAll(".cah-chip").forEach(c=>c.classList.remove("on"));s.classList.add("on");} renderTaskTable(); }

function viewTasks(v){
  const bar = el("div","cah-chipbar");
  const chips = [["all","All"],["mine","Lens: person"],["soon","Due this week"],["overdue","Overdue"],
    ["blocked","Blocked"],["awaiting","Awaiting input"],["open","Open"],["completed","Completed"]];
  chips.forEach(([k,l])=>{
    const c = el("button","cah-chip"+(TASK_QUICK===k?" on":"")); c.id="cah-quick-"+k; c.textContent=l;
    c.onclick=()=>{TASK_QUICK=k; document.querySelectorAll(".cah-chip").forEach(x=>x.classList.remove("on"));c.classList.add("on"); renderTaskTable();};
    bar.appendChild(c);
  });
  const search = el("input","cah-search"); search.placeholder="Search tasks…"; search.id="cah-tsearch";
  search.oninput = ()=>renderTaskTable();
  bar.appendChild(search);
  v.appendChild(bar);
  const wrap = el("div","cah-table-wrap"); wrap.id="cah-task-table";
  v.appendChild(wrap);
  renderTaskTable();
}

function filteredTasks(){
  let ts = DATA.tasks.slice();
  const q = ($("#cah-tsearch")?.value||"").toLowerCase();
  if(q) ts = ts.filter(t=>(t.task+t.person+t.workstream+t.notes+t.coord).toLowerCase().includes(q));
  if(FILTER_PERSON) ts = ts.filter(t=>taskMatchesPerson(t,FILTER_PERSON));
  switch(TASK_QUICK){
    case "mine": if(FILTER_PERSON) ts=ts.filter(t=>taskMatchesPerson(t,FILTER_PERSON)); break;
    case "soon": ts=ts.filter(t=>{const d=daysBetween(t.due);return isOpen(t)&&d!=null&&d>=0&&d<=7;}); break;
    case "overdue": ts=ts.filter(t=>{const d=daysBetween(t.due);return isOpen(t)&&d!=null&&d<0;}); break;
    case "blocked": ts=ts.filter(t=>t.status==="Blocked"); break;
    case "awaiting": ts=ts.filter(t=>t.status==="Awaiting input"||t.status==="Under review"); break;
    case "open": ts=ts.filter(isOpen); break;
    case "completed": ts=ts.filter(t=>t.status==="Completed"); break;
  }
  return ts;
}

function renderTaskTable(){
  const wrap = $("#cah-task-table"); if(!wrap) return;
  const ts = filteredTasks();
  const tbl = el("table","cah-table");
  tbl.innerHTML = `<thead><tr>
    <th>Task</th><th>Workstream</th><th>Responsible</th><th>Priority</th>
    <th>Status</th><th>Due</th><th>Left</th><th>Link</th></tr></thead>`;
  const tb = el("tbody");
  if(!ts.length){ const tr=el("tr"); const td=el("td"); td.colSpan=8; td.className="cah-empty"; td.textContent="No tasks match."; tr.appendChild(td); tb.appendChild(tr); }
  ts.forEach(t=>{
    const tr = el("tr","cah-trow");
    const left = daysBetween(t.due);
    const leftTxt = left==null?"—":(left<0?`${Math.abs(left)}d over`:`${left}d`);
    const leftCls = left==null?"":(left<0&&isOpen(t)?"cah-neg":(left<=3&&isOpen(t)?"cah-warn":""));
    tr.innerHTML = `
      <td class="cah-td-task">${esc(t.task)}${t.notes?`<span class="cah-td-note">${esc(t.notes)}</span>`:""}</td>
      <td><span class="cah-ws-pill">${esc(t.workstream)}</span></td>
      <td>${esc(t.person||"—")}${t.coord?`<span class="cah-td-note">w/ ${esc(t.coord)}</span>`:""}</td>
      <td><span class="cah-prio" style="--pc:${PRIORITY_COLOR[t.priority]||C.grey}">${esc(t.priority||"—")}</span></td>
      <td><span class="cah-status" style="--sc:${STATUS_COLOR[t.status]||C.grey}">${esc(t.status)}</span></td>
      <td>${fmtDate(t.due)}</td>
      <td class="${leftCls}">${leftTxt}</td>
      <td>${t.link?`<a href="${t.link}" target="_blank" rel="noopener" class="cah-link-ic" title="${esc(t.linkName||'Open')}">${icon('note')}</a>`:"—"}</td>`;
    tr.onclick = (e)=>{ if(e.target.closest("a"))return; openTaskModal(t.id); };
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  wrap.innerHTML = `<div class="cah-table-count">${ts.length} task${ts.length===1?"":"s"}</div>`;
  wrap.appendChild(tbl);
}

/* ---------- TIMELINE ---------- */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function viewTimeline(v){
  let dated = DATA.tasks.filter(t=>t.due).slice().sort((a,b)=>a.due<b.due?-1:1);
  if(FILTER_PERSON) dated = dated.filter(t=>taskMatchesPerson(t,FILTER_PERSON));
  const undated = DATA.tasks.filter(t=>!t.due && isOpen(t) && (!FILTER_PERSON||taskMatchesPerson(t,FILTER_PERSON)));

  // summary strip
  const past = dated.filter(t=>daysBetween(t.due)<0 && isOpen(t)).length;
  const strip = el("div","cah-tl-summary");
  strip.innerHTML = `
    <div class="cah-tl-sum"><b>${countdown()}</b><span>days to event</span></div>
    <div class="cah-tl-sum"><b>${dated.length}</b><span>dated milestones</span></div>
    <div class="cah-tl-sum ${past?'warn':''}"><b>${past}</b><span>overdue & open</span></div>
    <div class="cah-tl-sum"><b>${undated.length}</b><span>open, no date</span></div>`;
  v.appendChild(strip);
  if(FILTER_PERSON){ const l=el("div","cah-tl-lens","Filtered to "+FILTER_PERSON+" · clear the Lens to see all"); v.appendChild(l); }

  const groups = {}; dated.forEach(t=>{ (groups[t.due]=groups[t.due]||[]).push(t); });
  const line = el("div","cah-timeline");
  let lastMonth="";
  const insertEventAfter = ()=>{}; // event added at correct chronological point below
  const keys = Object.keys(groups).sort();
  const evISO = EVENT.startISO;
  let eventPlaced=false;
  function placeEvent(){
    if(eventPlaced) return; eventPlaced=true;
    const ev = el("div","cah-tl-node cah-tl-event");
    ev.innerHTML = `<div class="cah-tl-marker event"></div>
      <div class="cah-tl-date"><b>${EVENT.dates}</b> <span class="cah-tl-rel">${countdown()}d</span></div>
      <div class="cah-tl-items"><div class="cah-tl-eventlbl">🎈 Clean Air Horizons 2026 — ${EVENT.venue}</div></div>`;
    line.appendChild(ev);
  }
  keys.forEach(due=>{
    if(due>evISO) placeEvent();
    const d = daysBetween(due);
    const mo = MONTHS[new Date(due+"T00:00:00").getMonth()]+" "+new Date(due+"T00:00:00").getFullYear();
    if(mo!==lastMonth){ lastMonth=mo; const band=el("div","cah-tl-month",mo); line.appendChild(band); }
    const node = el("div","cah-tl-node");
    const near = d!=null && d>=0 && d<=14;
    const openCount = groups[due].filter(isOpen).length;
    node.innerHTML = `<div class="cah-tl-marker ${d<0?'past':''} ${near?'near':''}"></div>
      <div class="cah-tl-date">${fmtDate(due)}${d!=null?` <span class="cah-tl-rel">${d<0?Math.abs(d)+'d ago':'in '+d+'d'}</span>`:""}</div>`;
    const items = el("div","cah-tl-items");
    groups[due].forEach(t=>{
      const it = el("button","cah-tl-item"); it.style.setProperty("--stc",STATUS_COLOR[t.status]||C.grey);
      it.innerHTML = `<span class="cah-status-dot" style="background:${STATUS_COLOR[t.status]}"></span>
        <span class="cah-tl-name">${esc(t.task)}</span>
        <span class="cah-ws-pill sm">${esc(t.workstream)}</span>
        <span class="cah-tl-person">${esc(splitNames(t.person)[0]||"—")}</span>`;
      it.onclick=()=>openTaskModal(t.id);
      items.appendChild(it);
    });
    node.appendChild(items);
    line.appendChild(node);
  });
  placeEvent();
  v.appendChild(line);

  if(undated.length){
    const card=el("div","cah-card"); card.style.marginTop="18px";
    card.appendChild(cardHead("Open tasks without a due date", undated.length+" to schedule"));
    const list=el("div","cah-mini-list");
    undated.forEach(t=>{
      const row=el("button","cah-mini-row");
      row.innerHTML=`<span class="cah-dot" style="background:${STATUS_COLOR[t.status]}"></span>
        <span class="cah-mini-task">${esc(t.task)}</span>
        <span class="cah-mini-person">${esc(splitNames(t.person)[0]||"—")}</span>
        <span class="cah-mini-tag" style="color:var(--blue)">Set date</span>`;
      row.onclick=()=>openTaskModal(t.id);
      list.appendChild(row);
    });
    card.appendChild(list); v.appendChild(card);
  }
}

  const t = id? DATA.tasks.find(x=>x.id===id) : {id:"T"+Date.now(),task:"",workstream:WORKSTREAMS[0],person:"",coord:"",dependency:"",priority:"Medium",status:"Not started",start:"",due:"",link:"",linkName:"",notes:"",updated:"2026-08-17"};
  const isNew = !id;
  const ov = el("div","cah-modal-ov");
  const m = el("div","cah-modal");
  m.innerHTML = `<div class="cah-modal-head"><h2>${isNew?"Add task":"Edit task"}</h2><button class="cah-modal-x">×</button></div>`;
  const body = el("div","cah-modal-body");
  function field(label,key,type="text",opts){
    const wrap=el("label","cah-field"); wrap.appendChild(el("span",null,label));
    let inp;
    if(type==="select"){ inp=el("select"); opts.forEach(o=>{const op=el("option",null,o);if(t[key]===o)op.selected=true;inp.appendChild(op);}); }
    else if(type==="textarea"){ inp=el("textarea"); inp.value=t[key]||""; }
    else { inp=el("input"); inp.type=type; inp.value=t[key]||""; }
    inp.dataset.key=key; wrap.appendChild(inp); return wrap;
  }
  function pickerField(label,key){
    const wrap=el("div","cah-field"); wrap.appendChild(el("span",null,label));
    wrap.appendChild(personPicker(t[key]||"", val=>{ t[key]=val; }));
    return wrap;
  }
  const g = el("div","cah-modal-grid");
  g.appendChild(field("Task / activity","task"));
  g.appendChild(field("Workstream","workstream","select",WORKSTREAMS));
  g.appendChild(pickerField("Person responsible","person"));
  g.appendChild(pickerField("Supporting / coordinate with","coord"));
  g.appendChild(field("Dependent upon (task or person)","dependency"));
  g.appendChild(field("Priority","priority","select",["High","Medium","Low"]));
  g.appendChild(field("Status","status","select",STATUSES));
  g.appendChild(field("Due date","due","date"));
  g.appendChild(field("Link (URL)","link"));
  g.appendChild(field("Link label","linkName"));
  body.appendChild(g);
  body.appendChild(field("Comments / notes & next action","notes","textarea"));
  m.appendChild(body);
  const foot = el("div","cah-modal-foot");
  if(!isNew){ const del=el("button","cah-btn cah-btn-danger","Delete"); del.onclick=()=>{ if(confirm("Delete this task?")){DATA.tasks=DATA.tasks.filter(x=>x.id!==t.id);persist();ov.remove();renderView();flash("Task deleted");}}; foot.appendChild(del); }
  const spacer=el("div"); spacer.style.flex="1"; foot.appendChild(spacer);
  const cancel=el("button","cah-btn cah-btn-ghost","Cancel"); cancel.onclick=()=>ov.remove(); foot.appendChild(cancel);
  const save=el("button","cah-btn cah-btn-primary",isNew?"Add task":"Save"); 
  save.onclick=()=>{
    m.querySelectorAll("[data-key]").forEach(inp=>{ t[inp.dataset.key]=inp.value; });
    t.updated="2026-08-17";
    if(!t.task.trim()){ flash("Task needs a name"); return; }
    if(isNew) DATA.tasks.push(t);
    persist(); ov.remove(); renderView(); flash(isNew?"Task added":"Saved");
  };
  foot.appendChild(save);
  m.appendChild(foot);
  m.querySelector(".cah-modal-x").onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.appendChild(m); document.body.appendChild(ov);
}

/* ============================================================
   PERSIST + BOOT
   ============================================================ */
const DATA_VERSION = 3; /* bump to refresh roster / add new sections on already-saved copies */
function persist(){ return saveData(DATA); }
async function boot(){
  injectStyles();
  let saved = null;
  try{ saved = await loadData(); }catch(e){ console.error("load failed", e); }
  if(saved){
    DATA = saved;
    /* keep user-edited content, but backfill new sections when the schema is outdated */
    if(DATA.version !== DATA_VERSION){
      DATA.people = SEED_PEOPLE;
      if(!DATA.quickLinks || !DATA.quickLinks.length) DATA.quickLinks = SEED_QUICKLINKS;
      if(!DATA.agenda || !DATA.agenda.length) DATA.agenda = SEED_AGENDA;
      if(!DATA.sessions || !DATA.sessions.length) DATA.sessions = SESSIONS.map(s=>({...s}));
      DATA.version = DATA_VERSION;
      try{ await saveData(DATA); }catch(e){}
    }
  } else {
    DATA = { version:DATA_VERSION, tasks:SEED_TASKS, resources:SEED_RESOURCES, people:SEED_PEOPLE,
      quickLinks:SEED_QUICKLINKS, agenda:SEED_AGENDA, sessions:SESSIONS.map(s=>({...s})),
      announcements:[{id:"A0",msg:"Hub is live — everyone can add and edit tasks, resources, links and notes here. This is our single source of truth.",date:"2026-08-17"}],
      notes:[] };
    try{ await saveData(DATA); }catch(e){}
  }
  render();
  if(STORAGE_MODE === "memory") showStorageWarning();
}

/* Never leave a blank page */
function safeBoot(){
  try{ boot().catch(showBootError); }catch(e){ showBootError(e); }
}
function showBootError(e){
  console.error(e);
  const root = document.getElementById("cah-root") || document.body;
  root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:24px;'
    + 'border:1px solid #e3e8ec;border-radius:12px;color:#1c2530">'
    + '<h2 style="margin:0 0 8px">The hub could not start</h2>'
    + '<p style="color:#5a6b7a;line-height:1.5">Try a hard refresh (Ctrl/Cmd + Shift + R), or open it in a normal (non-private) browser window.</p>'
    + '<pre style="background:#f4f6f8;padding:10px;border-radius:8px;font-size:12px;overflow:auto">'
    + String(e && e.message ? e.message : e) + '</pre></div>';
}
function showStorageWarning(){
  if(document.getElementById("cah-storewarn")) return;
  const bar = document.createElement("div");
  bar.id = "cah-storewarn";
  bar.innerHTML = 'Changes are kept for this session only — this browser is blocking saved storage '
    + '(common when a file is opened directly from your computer, or in a private window). '
    + 'Host the file online, or use <b>Backup</b> in the sidebar to save your data to a file.';
  bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9998;background:#B93A26;color:#fff;"
    + "font-family:system-ui,sans-serif;font-size:12.5px;line-height:1.4;padding:10px 44px 10px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.15)";
  const x = document.createElement("button");
  x.textContent = "×";
  x.style.cssText = "position:absolute;right:12px;top:8px;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1";
  x.onclick = ()=>bar.remove();
  bar.appendChild(x);
  document.body.appendChild(bar);
}

  .cah-picker-x{border:none;background:none;color:var(--blueS);font-size:15px;line-height:1;cursor:pointer;padding:0 4px;border-radius:50%;}
  .cah-picker-x:hover{background:var(--blue);color:#fff;}
  .cah-picker-select{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px dashed var(--blueT);border-radius:8px;background:#fbfdfe;color:var(--blueS);cursor:pointer;width:100%;}
  .cah-picker-select:focus{outline:none;border-style:solid;border-color:var(--blue);}
  /* PEOPLE BAR */
  .cah-people-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .cah-people-intro{flex:1;min-width:220px;font-size:13px;color:var(--ink2);background:#eef6fb;border:1px solid #d9e9f4;border-radius:9px;padding:11px 14px;}
  .cah-person-card{position:relative;}
  .cah-person-editx{position:absolute;top:10px;right:10px;border:none;background:none;color:var(--grey);cursor:pointer;padding:4px;border-radius:6px;opacity:0;transition:opacity .15s;}
  .cah-person-editx svg{width:14px;height:14px;}
  .cah-person-card:hover .cah-person-editx{opacity:1;}
  .cah-person-editx:hover{background:#eef2f5;color:var(--blue);}
  .cah-noemail{color:var(--grey);font-style:italic;}
  /* TIMELINE additions */
  .cah-tl-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .cah-tl-sum{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;}
  .cah-tl-sum b{font-size:24px;font-weight:750;color:var(--blueD);display:block;line-height:1;}
  .cah-tl-sum span{font-size:11px;color:var(--ink2);}
  .cah-tl-sum.warn b{color:var(--red);}
  .cah-tl-lens{font-size:12px;color:var(--orange);background:#fff5ef;border:1px solid #f6d9c9;border-radius:8px;padding:8px 12px;margin-bottom:14px;}
  .cah-tl-month{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1px;color:var(--blueS);margin:6px 0 10px -22px;padding-left:22px;}
  .cah-tl-name{flex:1;}
  .cah-ws-pill.sm{font-size:9.5px;padding:2px 6px;}
  .cah-tl-item{border-left:3px solid var(--stc);}
  /* SESSIONS editable */
  .cah-sess-table td{vertical-align:top;}
  .cah-sess-table .cah-picker{min-width:150px;}
  .cah-modal-note{font-size:12px;color:var(--ink2);margin:0 0 14px;line-height:1.5;}
  .cah-edit-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px;}
  .cah-edit-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:5px 6px;border-bottom:1px solid var(--line);}
  .cah-edit-table td{padding:3px 4px;}
  .cah-edit-table input,.cah-edit-table select{width:100%;font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;}
  .cah-add-row{margin:2px 0 6px;}
  /* CHIPBAR */
  .cah-chipbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .cah-chip{font-family:inherit;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--line);
    background:#fff;color:var(--ink2);cursor:pointer;}
  .cah-chip:hover{border-color:var(--blueT);color:var(--ink);}
  .cah-chip.on{background:var(--blueD);color:#fff;border-color:var(--blueD);}
  .cah-search{margin-left:auto;font-family:inherit;font-size:13px;padding:8px 13px;border:1px solid var(--line);
    border-radius:8px;background:#fff;min-width:200px;}
  /* TABLE */
  .cah-table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .cah-table-count{font-size:11.5px;color:var(--ink2);padding:11px 16px 0;}
  .cah-table{width:100%;border-collapse:collapse;font-size:12.8px;}
  .cah-table thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);
    font-weight:650;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafcfd;}
  .cah-table tbody td{padding:11px 14px;border-bottom:1px solid #f0f3f5;vertical-align:top;}
  .cah-trow{cursor:pointer;transition:background .12s;}
  .cah-trow:hover{background:#f7fafc;}
  .cah-td-task{font-weight:600;color:var(--ink);max-width:280px;}
  .cah-td-note{display:block;font-weight:400;font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.35;}
  .cah-ws-pill{font-size:10.5px;background:#eef4f9;color:var(--blueS);padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .cah-prio{font-size:11px;font-weight:650;color:var(--pc);}
  .cah-prio::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pc);margin-right:5px;vertical-align:middle;}
  .cah-status{font-size:11px;font-weight:600;color:#fff;background:var(--sc);padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .cah-neg{color:var(--red);font-weight:650;}
  .cah-warn{color:var(--orange);font-weight:600;}
  .cah-link-ic{display:inline-flex;color:var(--blue);}
  .cah-link-ic svg{width:15px;height:15px;}
  /* WORKSTREAMS */
  .cah-ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .cah-ws-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;}
  .cah-ws-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .cah-ws-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px;}
  .cah-ws-pct{font-size:13px;font-weight:700;color:var(--greenS);}
  .cah-ws-tasks{display:flex;flex-direction:column;margin-top:11px;}
  .cah-ws-task{display:flex;align-items:center;gap:9px;padding:7px 4px;border:none;background:none;
    border-bottom:1px solid #f2f5f7;cursor:pointer;font-family:inherit;text-align:left;font-size:12.5px;width:100%;}
  .cah-ws-task:hover{background:#f7fafc;}
  .cah-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cah-ws-task-name{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cah-ws-task-name.done{color:var(--ink2);text-decoration:line-through;}
  .cah-ws-task-p{font-size:11px;color:var(--ink2);flex-shrink:0;}
  /* DEPENDENCIES */
  .cah-dep-intro{font-size:13px;color:var(--ink2);background:#eef6fb;border:1px solid #d9e9f4;border-radius:9px;padding:11px 14px;margin-bottom:16px;}
  .cah-dep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;}
  .cah-dep-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:11px;padding:14px 15px;cursor:pointer;transition:box-shadow .12s;}
  .cah-dep-card:hover{box-shadow:0 5px 14px rgba(2,31,60,.08);}
  .cah-dep-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .cah-dep-prio{font-size:11px;font-weight:650;}
  .cah-dep-task{font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.3;margin-bottom:10px;}
  .cah-dep-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cah-dep-node{font-size:11.5px;background:#eef2f5;padding:4px 9px;border-radius:6px;color:var(--ink);}
  .cah-dep-node.hl{background:var(--orangeT);color:#5a2410;font-weight:600;}
  .cah-dep-arrow{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;}
  .cah-dep-note{font-size:11.5px;color:var(--ink2);margin-top:9px;line-height:1.4;}
  /* PEOPLE */
  .cah-people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .cah-person-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;}
  .cah-person-head{display:flex;gap:11px;align-items:center;margin-bottom:11px;}
  .cah-avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blueS));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .cah-person-id{min-width:0;}
  .cah-person-name{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .cah-person-role{font-size:11px;color:var(--blueS);margin-top:1px;font-weight:600;}
  .cah-person-email{font-size:11px;color:var(--ink2);text-decoration:none;word-break:break-all;display:block;margin-top:2px;}
  .cah-person-email:hover{color:var(--blue);text-decoration:underline;}
  .cah-role-pill{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--greenS);padding:2px 6px;border-radius:5px;}
  .cah-role-pill.ext{background:var(--grey);}
  .cah-person-idle{opacity:.72;}
  .cah-person-idle:hover{opacity:1;}
  .cah-person-stats{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);margin-bottom:10px;}
  .cah-person-stats b{color:var(--ink);font-size:13px;}
  .cah-person-tasks{display:flex;flex-direction:column;flex:1;}
  .cah-person-task{display:flex;align-items:center;gap:8px;padding:6px 3px;border:none;background:none;cursor:pointer;
    font-family:inherit;text-align:left;font-size:12px;color:var(--ink);border-bottom:1px solid #f2f5f7;width:100%;}
  .cah-person-task:hover{background:#f7fafc;}
  .cah-person-more{font-size:11px;color:var(--blue);padding:6px 3px;}
  .cah-person-lens{margin-top:11px;font-family:inherit;font-size:12px;font-weight:600;color:var(--blue);
    background:#eef6fb;border:1px solid #d9e9f4;border-radius:8px;padding:8px;cursor:pointer;}
  .cah-person-lens:hover{background:#dcecf7;}
  /* SESSIONS */
  .cah-day-head{font-size:14px;font-weight:700;color:var(--blueD);margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--blueT);}
  .cah-day-head:first-of-type{margin-top:4px;}
  .cah-hl-row{background:#fff5ef !important;}
  .cah-hl-row td:first-child{box-shadow:inset 3px 0 var(--orange);}
  /* TIMELINE */
  .cah-timeline{position:relative;padding-left:22px;}
  .cah-timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--blueT),#e3e8ec);}
  .cah-tl-node{position:relative;margin-bottom:18px;}
  .cah-tl-marker{position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);}
  .cah-tl-marker.past{border-color:var(--grey);}
  .cah-tl-marker.near{border-color:var(--orange);box-shadow:0 0 0 4px rgba(232,87,36,.15);}
  .cah-tl-marker.event{border-color:var(--red);background:var(--red);width:14px;height:14px;left:-23px;box-shadow:0 0 0 5px rgba(185,58,38,.18);}
  .cah-tl-date{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .cah-tl-rel{font-size:11px;font-weight:500;color:var(--ink2);margin-left:6px;}
  .cah-tl-items{display:flex;flex-direction:column;gap:5px;}
  .cah-tl-item{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left;font-size:12.5px;color:var(--ink);width:100%;}
  .cah-tl-item:hover{border-color:var(--blueT);background:#f7fafc;}
  .cah-tl-item span:nth-child(2){flex:1;}
  .cah-tl-person{font-size:11px;color:var(--ink2);}
  .cah-tl-event .cah-tl-date b{color:var(--red);}
  .cah-tl-eventlbl{background:linear-gradient(120deg,var(--blueD),var(--blueS));color:#fff;border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;}
  /* RESOURCES */
  .cah-res-sec{margin-bottom:22px;}
  .cah-res-secttl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--blueS);margin-bottom:10px;}
  .cah-res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .cah-res-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;}
  .cah-res-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cah-res-type{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);background:#f0f3f6;padding:3px 8px;border-radius:5px;}
  .cah-res-status{font-size:10px;font-weight:600;color:var(--blue);}
  .cah-res-status.final{color:var(--greenS);}
  .cah-res-name{font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.25;margin-bottom:5px;}
  .cah-res-desc{font-size:11.5px;color:var(--ink2);line-height:1.4;flex:1;margin-bottom:11px;}
  .cah-res-foot{display:flex;justify-content:space-between;align-items:center;}
  .cah-res-open{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;}
  .cah-res-open:hover{text-decoration:underline;}
  .cah-res-nolink{font-size:11px;color:var(--grey);font-style:italic;}
  .cah-res-edit{font-family:inherit;font-size:11.5px;color:var(--ink2);background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:5px;}
  .cah-res-edit:hover{background:#f0f3f6;color:var(--ink);}
  /* NOTES */
  .cah-notes-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .cah-note-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;}
  .cah-note-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:relative;}
  .cah-note-head b{font-size:14px;}
  .cah-note-head span{font-size:11.5px;color:var(--ink2);}
  .cah-note-body{font-size:12.8px;line-height:1.55;color:var(--ink);}
  /* MODAL */
  .cah-modal-ov{position:fixed;inset:0;background:rgba(2,31,60,.42);backdrop-filter:blur(3px);z-index:9999;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .cah-modal{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(2,31,60,.3);}
  .cah-modal-wide{max-width:820px;}
  .cah-modal-sm{max-width:460px;}
  .cah-modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
  .cah-modal-head h2{margin:0;font-size:17px;font-weight:750;}
  .cah-modal-x{border:none;background:none;font-size:24px;color:var(--grey);cursor:pointer;line-height:1;}
  .cah-modal-x:hover{color:var(--red);}
  .cah-modal-body{padding:20px 22px;}
  .cah-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .cah-field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;}
  .cah-field input,.cah-field select,.cah-field textarea{font-family:inherit;font-size:13.5px;font-weight:400;text-transform:none;letter-spacing:0;
    padding:9px 11px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;width:100%;}
  .cah-field textarea{min-height:72px;resize:vertical;}
  .cah-field input:focus,.cah-field select:focus,.cah-field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,155,214,.13);}
  .cah-modal-foot{display:flex;gap:10px;align-items:center;padding:16px 22px;border-top:1px solid var(--line);}
  /* FLASH */
  .cah-flash{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--blueD);color:#fff;
    padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:10000;opacity:0;transition:opacity .3s,transform .3s;
    box-shadow:0 8px 24px rgba(2,31,60,.3);font-family:-apple-system,sans-serif;}
  .cah-flash.show{opacity:1;transform:translate(-50%,0);}
  /* RESPONSIVE */
  @media(max-width:1080px){
    #cah-root{flex-direction:column;}
    .cah-side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:8px;}
    .cah-brand{padding:0;flex:1;}
    .cah-nav{flex-direction:row;flex-wrap:wrap;order:3;width:100%;}
    .cah-nav-item{width:auto;padding:8px 11px;font-size:12.5px;}
    .cah-nav-item .ci{width:17px;height:17px;}
    .cah-side-foot{margin:0;padding:0;border:none;display:flex;gap:12px;align-items:center;}
    .cah-side-count{margin:0;}
    .cah-dash-grid{grid-template-columns:1fr;}
    .cah-tiles{grid-template-columns:1fr 1fr;}
    .cah-modal-grid{grid-template-columns:1fr;}
    .cah-ag-days{grid-template-columns:1fr;}
    .cah-tl-summary{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:620px){
    .cah-content{padding:16px 14px 40px;}
    .cah-hero{flex-direction:column;}.cah-hero-count{align-self:flex-start;}
    .cah-top{flex-wrap:wrap;}.cah-search{min-width:140px;}
    .cah-table{font-size:11.5px;}
    .cah-table:not(.cah-sess-table) thead th:nth-child(2),.cah-table:not(.cah-sess-table) td:nth-child(2){display:none;}
    .cah-ag-row{grid-template-columns:60px 1fr;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}
  `;
  const st = document.createElement("style"); st.textContent=css; document.head.appendChild(st);
}

safeBoot();
</script>
</body>
</html>
